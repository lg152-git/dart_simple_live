name: build-windows

# 每次运行都以 main 分支最新一次 commit 为源码构建 Windows 桌面绿色分发包（zip）。
# 仅手动触发（workflow_dispatch）：默认构建 main 最新 commit，也可指定其它 ref，不随 push 自动运行。
# 产物：build\windows\x64\runner\Release\ 整目录打包为 zip，解压后直接运行 simple_live_app.exe。
# 不产出 MSIX（未签名无法安装），也不做 Inno 安装器。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要检出的 Git ref（默认 main，即 main 分支最新一次 commit）"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # 始终检出 main 分支的最新 commit（手动触发未填 ref 时回退为 main）
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Show build commit
        id: commit_info
        shell: bash
        run: |
          echo "===== 源码信息 ====="
          git log -1 --format="commit: %H%nshort:  %h%nauthor: %an <%ae>%ndate:   %ad%nsubject: %s"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          cache: true

      - name: Restore packages
        shell: bash
        run: |
          cd simple_live_app
          flutter pub get

      - name: Build Windows (release)
        shell: bash
        run: |
          cd simple_live_app
          flutter build windows --release

      - name: Package portable ZIP
        shell: pwsh
        run: |
          # 用 GITHUB_WORKSPACE 动态定位，不硬编码 runner 路径。
          $ws = $env:GITHUB_WORKSPACE
          $relDir = Join-Path $ws "simple_live_app\build\windows\x64\runner\Release"
          $sha = "${{ steps.commit_info.outputs.short_sha }}"
          if (-not (Test-Path $relDir)) {
            Write-Host "Looking for: $relDir"
            Write-Host "--- found under build\ ---"
            if (Test-Path (Join-Path $ws "simple_live_app\build")) {
              Get-ChildItem (Join-Path $ws "simple_live_app\build") -Recurse -Directory | Select-Object -First 30 | ForEach-Object { Write-Host $_.FullName }
            }
            throw "Release output dir not found: $relDir"
          }
          $exe = Get-ChildItem $relDir -Filter "simple_live_app.exe" | Select-Object -First 1
          if (-not $exe) { Write-Warning "simple_live_app.exe not found in $relDir" }
          $zipName = "simple_live_app-windows-$sha.zip"
          $zipPath = Join-Path $ws $zipName
          Compress-Archive -Path "$relDir\*" -DestinationPath $zipPath -Force
          Write-Host "zip ready: $zipName"
          Write-Host "=== zip source (top of Release) ==="
          Get-ChildItem $relDir | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ steps.commit_info.outputs.short_sha }}
          path: simple_live_app-windows-${{ steps.commit_info.outputs.short_sha }}.zip
          if-no-files-found: error

      - name: Summary
        shell: bash
        run: |
          echo "🪟 Windows portable zip built from main tip: ${{ steps.commit_info.outputs.short_sha }}"
          echo "解压后直接运行 simple_live_app.exe，无需安装、无需签名。"
